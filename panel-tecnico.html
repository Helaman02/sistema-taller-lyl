<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesorios L&amp;L — Panel de taller</title>
<link rel="icon" type="image/jpeg" href="icono-512.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1c2e;
    --navy-2:#16283f;
    --bg:#f4f5f7;
    --card:#ffffff;
    --border:#e2e5ea;
    --text:#1a2433;
    --muted:#5c6b7a;
    --green:#1f7a4f;
    --green-dark:#175f3d;
    --amber:#b45309;
    --amber-bg:#fdf1e2;
    --red:#b3261e;
    --red-bg:#fdecea;
    --blue:#1d5fa3;
    --blue-bg:#e9f1fb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  h1,h2,h3,.mono-label{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .shell{display:grid;grid-template-columns:340px 1fr;min-height:100vh;}

  /* ---- Columna de órdenes ---- */
  .orders{
    background:var(--navy);
    color:#dbe4ee;
    padding:24px 18px;
    display:flex;
    flex-direction:column;
    gap:16px;
    overflow-y:auto;
    max-height:100vh;
  }
  .orders__title{margin:0;font-size:1.1rem;color:#fff;}
  .orders__title span{display:block;font-size:.78rem;color:#8ea3b8;font-weight:500;margin-top:2px;}

  .orders__controls{display:flex;flex-direction:column;gap:8px;}
  .orders__controls input,
  .orders__controls select{
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid #2a3f58;
    background:var(--navy-2);
    color:#eaf0f6;
    font-family:'Inter',sans-serif;
    font-size:.88rem;
  }
  .orders__controls input::placeholder{color:#7d90a4;}

  .orders__list{display:flex;flex-direction:column;gap:8px;}
  .order-card{
    background:var(--navy-2);
    border:1px solid #22384f;
    border-radius:10px;
    padding:12px 12px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .order-card:hover{border-color:#3a5977;}
  .order-card.is-active{background:#1d3450;border-color:var(--green);}
  .order-card__top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .order-card__folio{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:#9fb4c8;}
  .order-card__cliente{margin:4px 0 2px;font-weight:600;font-size:.92rem;color:#fff;}
  .order-card__equipo{font-size:.8rem;color:#9fb4c8;}

  .badge{
    display:inline-block;
    padding:2px 9px;
    border-radius:999px;
    font-size:.7rem;
    font-weight:600;
    white-space:nowrap;
  }
  .badge--pendiente{background:var(--amber-bg);color:var(--amber);}
  .badge--proceso{background:var(--blue-bg);color:var(--blue);}
  .badge--espera{background:var(--red-bg);color:var(--red);}
  .badge--listo,.badge--entregado{background:#e6f4ec;color:var(--green-dark);}
  .badge--cancelado{background:#eee;color:#666;}

  .empty-orders{color:#7d90a4;font-size:.85rem;padding:20px 4px;}

  /* ---- Panel de detalle ---- */
  .detail{padding:32px 40px;overflow-y:auto;max-height:100vh;}
  .detail__placeholder{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:.95rem;
    text-align:center;
  }

  .detail__head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  .detail__head h2{margin:0 0 4px;font-size:1.4rem;}
  .detail__head .sub{color:var(--muted);font-size:.9rem;}
  .detail__folio{font-family:'JetBrains Mono',monospace;font-size:.85rem;color:var(--muted);}

  .client-strip{
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 18px;
    margin-bottom:24px;
    font-size:.85rem;
  }
  .client-strip div span{display:block;color:var(--muted);font-size:.72rem;margin-bottom:2px;}

  .panel-section{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:20px;
    overflow-x: auto; 
  }
  .panel-section h3{margin:0 0 16px;font-size:1rem;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field-grid--3{grid-template-columns:1fr 1fr 1fr;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:.78rem;color:var(--muted);font-weight:600;}
  .field input,.field select,.field textarea{
    padding:9px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    font-family:'Inter',sans-serif;
    font-size:.88rem;
    background:#fbfbfc;
    color:var(--text);
  }
  .field textarea{resize:vertical;min-height:56px;}

  .save-row{display:flex;align-items:center;gap:12px;margin-top:18px;}
  button{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:.88rem;
    border:none;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
  }
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{background:var(--green-dark);}
  .btn-primary:disabled{opacity:.55;cursor:default;}
  .status-msg{font-size:.82rem;color:var(--muted);}
  .status-msg.ok{color:var(--green-dark);}
  .status-msg.err{color:var(--red);}

  /* ---- Repuestos ---- */
  table{width:100%;border-collapse:collapse;font-size:.86rem;}
  thead th{
    text-align:left;
    font-size:.72rem;
    text-transform:none;
    color:var(--muted);
    font-weight:600;
    padding:0 8px 8px;
    border-bottom:1px solid var(--border);
  }
  tbody td{padding:9px 8px;border-bottom:1px solid #f0f1f3;}
  tbody tr:last-child td{border-bottom:none;}
  .del-btn{
    background:none;border:none;color:var(--red);cursor:pointer;
    font-family:'Inter',sans-serif;font-size:.8rem;padding:4px 6px;
  }
  .repuestos-empty{color:var(--muted);font-size:.85rem;padding:12px 0;}

  .add-repuesto {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 14px;
    align-items: flex-end;
  }
  .add-repuesto .field {
    flex: 1 1 120px;
    gap: 4px;
  }
  .add-repuesto label { font-size: .75rem; }
  .add-repuesto button { 
    white-space: nowrap; 
    height: fit-content;
  }

  .total-row{
    display:flex;justify-content:flex-end;gap:8px;
    margin-top:12px;font-size:.88rem;
  }
  .total-row strong{font-family:'JetBrains Mono',monospace;}

  @media (max-width: 860px){
    .shell{grid-template-columns:1fr;}
    .orders{max-height:none;}
    .detail{max-height:none;padding:24px 18px;}
    .field-grid,.field-grid--3{grid-template-columns:1fr;}
    .add-repuesto{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div class="shell">

  <aside class="orders">
    <div>
      <h1 class="orders__title">Panel de taller
        <span>Control de flujo y repuestos</span>
      </h1>
    </div>

    <a href="index.html" style="display: block; background: #1d3450; color: #ffffff; text-align: center; text-decoration: none; padding: 10px; border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.9rem; border: 1px solid #3a5977; margin-top: 5px;">
      📝 Nueva Orden (Recepción)
    </a>
    <a href="panel-cobros.html" style="display: block; background: #1f7a4f; color: #ffffff; text-align: center; text-decoration: none; padding: 10px; border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.9rem; margin-top: 8px;">
      💵 Panel de Cobros
    </a>
    <a href="panel-kpis.html" style="display: block; background: #1d3450; color: #ffffff; text-align: center; text-decoration: none; padding: 10px; border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.9rem; border: 1px solid #3a5977; margin-top: 8px;">
      📊 Indicadores (KPIs)
    </a>
    <button type="button" id="btnCerrarSesion" style="display: block; width: 100%; background: none; color: #9fadb6; text-align: center; padding: 8px; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.82rem; border: none; cursor: pointer; margin-top: 8px;">
      Cerrar sesión
    </button>

    <div class="orders__controls">
      <input type="text" id="buscador" placeholder="Buscar cliente, folio o equipo…">
      <select id="filtroEstado">
        <option value="">Todos los estados</option>
        <option value="Pendiente de revisión">Pendiente de revisión</option>
        <option value="En diagnóstico">En diagnóstico</option>
        <option value="Esperando repuestos">Esperando repuestos</option>
        <option value="En reparación">En reparación</option>
        <option value="Listo para entrega">Listo para entrega</option>
        <option value="Entregado">Entregado</option>
        <option value="Cancelado">Cancelado</option>
      </select>
    </div>

    <div class="orders__list" id="listaOrdenes">
      <p class="empty-orders">Cargando órdenes…</p>
    </div>
  </aside>

  <main class="detail" id="detalle">
    <div class="detail__placeholder">Selecciona una orden de la lista para ver y editar su flujo.</div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="panel-tecnico.js"></script>
</body>
</html>
