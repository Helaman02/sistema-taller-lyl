<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesorios L&amp;L — Iniciar sesión</title>
<link rel="icon" type="image/jpeg" href="icono-512.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1c2e;
    --navy-2:#16283f;
    --green:#1f7a4f;
    --green-dark:#175f3d;
    --red:#b3261e;
    --red-bg:#fdecea;
    --border:#e2e5ea;
    --text:#1a2433;
    --muted:#5c6b7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:'Inter',sans-serif;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;max-width:380px;
    background:#ffffff;
    border-radius:14px;
    padding:34px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .card h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.25rem;margin:0 0 4px;color:var(--text);
  }
  .card p.sub{margin:0 0 26px;color:var(--muted);font-size:.88rem;}

  .field{margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.82rem;font-weight:600;color:var(--text);}
  .field input{
    padding:11px 12px;border-radius:8px;border:1px solid var(--border);
    font-family:'Inter',sans-serif;font-size:.92rem;background:#fbfbfc;color:var(--text);
  }
  .field input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,122,79,.14);}

  button{
    width:100%;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.94rem;
    color:#fff;background:var(--green);border:none;border-radius:8px;
    padding:12px;cursor:pointer;margin-top:6px;
  }
  button:hover{background:var(--green-dark);}
  button:disabled{opacity:.6;cursor:default;}

  .status-msg{
    margin-top:14px;font-size:.85rem;text-align:center;color:var(--muted);
  }
  .status-msg.err{color:var(--red);}

  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand__mark{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
    background:var(--green);color:#fff;padding:7px 9px;border-radius:6px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <img src="logo.jpg" alt="Logo Accesorios L&amp;L" style="width: 45px; height: 45px; object-fit: contain; border-radius: 8px;">
    </div>
    <h1>Iniciar sesión</h1>
    <p class="sub">Acceso solo para el equipo del taller.</p>

    <form id="formLogin">
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="btnEntrar">Entrar</button>
      <p class="status-msg" id="statusMsg"></p>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="login.js"></script>
</body>
</html>
